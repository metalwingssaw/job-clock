<title>Job Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: state-colored status card up top, ONE big action button that changes color by step, job notes while on site, today + week + mileage cards below, history tucked away */
:root{
  --bg:#eef1f5; --panel:#ffffff; --fg:#0e1a2b; --muted:#5d6b7e; --line:#dde3ea;
  --teal:#0d9488; --amber:#e9a21b; --blue:#2563eb; --red:#dc2626; --navy:#0e1a2b; --on-amber:#0e1a2b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1320; --panel:#131d2c; --fg:#e8edf3; --muted:#8b98aa; --line:#233044;
  --teal:#2dd4bf; --amber:#f5b52e; --blue:#60a5fa; --red:#f87171; --navy:#e8edf3; --on-amber:#0b1320;
  --shadow:none;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.45 var(--body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;cursor:pointer;border:0;color:var(--fg);background:none}
input,textarea{font:inherit;color:var(--fg)}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.k{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}

header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.brand img{width:34px;height:34px;border-radius:9px}
.brand span{color:var(--amber)}
.now{font:500 15px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}

/* status card, tinted by state */
.status{--c:var(--muted);display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);
  border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 70%)}
.status[data-s="on"]{--c:var(--teal)}
.status[data-s="site"]{--c:var(--amber)}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.status[data-s="on"] .pill i,.status[data-s="site"] .pill i{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.state{font:700 42px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.timer{font:500 18px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.where{font-size:15px;color:var(--muted);overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start}
.where:empty{display:none}

/* forgot warning */
.warn{background:color-mix(in srgb,var(--amber) 14%,var(--panel));border:2px solid var(--amber);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.warn b{font:700 22px/1.1 var(--display);text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--fg)}
.warn b .ic{color:var(--amber)}
.warn p{margin:0;font-size:15px}
.warn .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* fields */
.field{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);width:100%}
textarea.field{min-height:84px;resize:vertical}
.wo{display:flex;flex-direction:column;gap:8px}
.wo input{font:600 26px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--panel);width:100%;box-shadow:var(--shadow)}
.wo input:focus{border-color:var(--amber);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--line) 60%,var(--bg))}
.seg button{padding:10px 8px;border-radius:10px;font:600 16px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.seg button small{font-size:12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"]:last-child{color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px var(--mono);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.woopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nowo{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font:600 15px var(--body);cursor:pointer}
.nowo input{width:20px;height:20px;accent-color:var(--teal);margin:0}
.nowo:has(input:checked){border-color:var(--teal);color:var(--teal)}
.whbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font:600 15px var(--body);color:var(--blue)}
.wo input:disabled{opacity:.45}
.chip .ic{color:var(--muted);width:.95em;height:.95em}

/* big button: color = what you're about to do */
.go{--c:var(--teal);--t:#fff;width:100%;min-height:96px;border-radius:20px;background:var(--c);color:var(--t);
  box-shadow:0 8px 22px color-mix(in srgb,var(--c) 35%,transparent);
  font:700 34px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:14px}
.go[data-type="site_in"]{--c:var(--amber);--t:var(--on-amber)}
.go[data-type="site_out"]{--c:var(--blue)}
.go .ic{width:38px;height:38px;stroke-width:2.2}
.go .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.go small{font:500 14px var(--body);text-transform:none;letter-spacing:0;opacity:.8}
.go:disabled{opacity:.6;cursor:wait}
@media (prefers-color-scheme:dark){.go{--t:#0b1320}}
.alt,.btn{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font:600 16px var(--body);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px}
.alt{color:var(--red)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--red)}
.btn.danger.sure{background:var(--red);color:#fff;border-color:var(--red)}
.notebtn{color:var(--muted);font-size:15px;display:inline-flex;align-items:center;gap:6px;align-self:center}
.msg{font-size:15px;text-align:center;min-height:22px;color:var(--muted)}
.msg.err{color:var(--red)}
.actions{display:flex;flex-direction:column;gap:10px}

/* job notes + photos */
.job{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.job h3{margin:0;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.job h3 .ic{color:var(--amber)}
.job .field{background:var(--bg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:26px;text-align:center}
.thumb .x.sure{background:var(--red)}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:2px dashed var(--line);border-radius:14px;font:600 16px var(--body);cursor:pointer;color:var(--teal)}
.mini{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.mini img{width:46px;height:46px;object-fit:cover;border-radius:8px;cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);background:#fff;color:#000;border-radius:999px;padding:8px 14px;font-weight:600}

/* sections */
h2{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 .h{display:flex;align-items:center;gap:8px}
h2 .h .ic{color:var(--teal)}
h2 span.v{font:500 15px var(--mono);color:var(--muted);letter-spacing:0;text-transform:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child,.edit:first-child{border-top:0}
.badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.badge .ic{width:18px;height:18px}
.badge.in{--c:var(--teal)} .badge.out{--c:var(--red)} .badge.site{--c:var(--amber)} .badge.leave{--c:var(--blue)}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.tagline{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tag{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase}
.t{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.addr{font-size:14px;overflow-wrap:anywhere}
.addr a{color:inherit;text-decoration-color:var(--line)}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap;display:flex;gap:5px}
.editbtn{color:var(--muted);padding:6px;border-radius:8px}
.editbtn:hover{background:var(--bg)}
.edit{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.edit .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.leg{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.leg:first-child{border-top:0}
.leg.off{opacity:.5}
.mi{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--teal)}
.leg.off .mi{color:var(--muted)}
.mi small{display:block;font:500 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.route{font-size:14px;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.copy{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:600 13px var(--body);display:flex;align-items:center;gap:5px}
.empty{color:var(--muted);text-align:center;padding:22px 14px;font-size:15px}

/* week */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.ot b{color:var(--amber)}
.stat.mi2 b{color:var(--teal)}
.pay{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.payamt{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--green,var(--teal))}
.payamt small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.paybtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:600 14px var(--body)}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.payform .wide{grid-column:1/-1}
.paysub{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.paysub span{font-variant-numeric:tabular-nums}
.net{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 13px var(--body);color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.days{display:flex;flex-direction:column}
.dayrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 14px;font-size:15px;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dayrow span{font:500 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.dayrow.today{font-weight:600}

details{border-top:1px solid var(--line);padding-top:14px}
summary{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.weekhead{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.weekhead span{font:500 14px var(--mono);text-transform:none;letter-spacing:0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:600 15px var(--body);background:var(--panel);display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){.status .pill i{animation:none}}
@media (prefers-reduced-motion:no-preference){.go,.alt,.btn{transition:transform .08s}.go:active:not(:disabled),.alt:active,.btn:active{transform:scale(.98)}}
</style>

<script>
const KEY='jobclock.punches.v1', WOKEY='jobclock.recentwo.v1', DISMISS='jobclock.forgotdismiss.v1';
const LABEL={clock_in:'Clock in',site_in:'Site check-in',site_out:'Left site',clock_out:'Clock out'};
const CLS={clock_in:'in',site_in:'site',site_out:'leave',clock_out:'out'};
const $=id=>document.getElementById(id);
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const WAREHOUSE='Attronica Warehouse, 306 Ashcake Rd, Ashland, VA 23005';
const lab=p=>p.warehouse?(p.type==='site_in'?'Warehouse':'Left warehouse'):LABEL[p.type];
const ICON={clock_in:'in',site_in:'tool',site_out:'truck',clock_out:'out'};
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){say('Could not save on this phone. Check storage settings.',true)}};
let punches=read(KEY,[]), recentWO=read(WOKEY,[]), busy=false, isLocal=read('jobclock.local.v1',true);
punches.forEach(p=>{if(p.locating)delete p.locating});
let editingId=null, sureDelete=null, surePhoto=null;
const save=()=>{punches.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);write(KEY,punches)};
function setLocal(v){isLocal=v;write('jobclock.local.v1',v);$('locBtn').setAttribute('aria-pressed',v);$('farBtn').setAttribute('aria-pressed',!v)}

const fmtTime=d=>new Date(d).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtDay=d=>new Date(d).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}; // Monday
const hm=ms=>{const m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const place=p=>p.address||(p.locating?'Getting location…':p.lat!=null?`${p.lat}, ${p.lon}`:'No location');
const toLocalInput=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
function say(t,err){$('msg').textContent=t;$('msg').className='msg'+(err?' err':'')}

/* ---------- photo storage (IndexedDB, stays on this phone) ---------- */
const photoDB=(()=>{
  let dbp;
  const open=()=>dbp??=new Promise((res,rej)=>{const r=indexedDB.open('jobclock',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const run=async(mode,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('photos',mode),req=fn(t.objectStore('photos'));t.oncomplete=()=>res(req.result);t.onerror=()=>rej(t.error)})};
  return {put:(k,v)=>run('readwrite',s=>s.put(v,k)),get:k=>run('readonly',s=>s.get(k)),del:k=>run('readwrite',s=>s.delete(k))};
})();
const urlCache={};
async function photoURL(id){if(urlCache[id])return urlCache[id];try{const b=await photoDB.get(id);if(b)return urlCache[id]=URL.createObjectURL(b)}catch(e){}return null}
async function shrink(file){
  const src=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
    const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.75));
  }catch(e){return file}finally{URL.revokeObjectURL(src)}
}
async function addPhotos(visit,files){
  if(!files.length)return;
  try{navigator.storage?.persist?.()}catch(e){}
  say('Saving photo…');
  for(const f of files){
    const id='ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await photoDB.put(id,await shrink(f));(visit.photos??=[]).push(id)}catch(e){say('Could not save that photo. Phone storage may be full.',true);return}
  }
  save();render();say(files.length>1?`${files.length} photos saved.`:'Photo saved.');
}
async function removePhoto(visit,id){

/* ---------- state ---------- */
function state(){
  let s='off',since=null,last=null,wo=null,loc=null,visit=null,wh=false;
  for(const p of punches){
    if(p.type==='clock_in'){s='on';since=p.time}
    else if(p.type==='site_in'){s='site';since=p.time;wo=p.workOrder;loc=p.local;visit=p;wh=!!p.warehouse}
    else if(p.type==='site_out'){s='on';since=p.time;wo=null;visit=null}
    else if(p.type==='clock_out'){s='off';since=p.time;wo=null;visit=null}
    last=p;
  }
  let shift=null;
  for(let i=punches.length-1;i>=0;i--){if(punches[i].type==='clock_in'){shift=punches[i].time;break}if(punches[i].type==='clock_out')break}
  return {s,since,last,wo,shift,loc,visit,wh};
}
// every clock-in paired with the next clock-out; hours land on the day you clocked in
function shifts(){
  const out=[];let start=null;
  for(const p of punches){
    if(p.type==='clock_in')start=p.time;
    else if(p.type==='clock_out'&&start){out.push({start,end:p.time});start=null}
  }
  if(start)out.push({start,end:null});
  return out;
}
const shiftMs=sh=>(sh.end?new Date(sh.end):new Date())-new Date(sh.start);
function hoursByDay(){const m={};shifts().forEach(sh=>{const k=dayKey(sh.start);m[k]=(m[k]||0)+shiftMs(sh)});return m}

/* ---------- location ---------- */
// GPS: watch for up to 8 seconds and keep the most accurate reading (stops early once it's within 20 m)
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('This browser has no location access.'));
    let best=null,done=false,id;
    const finish=()=>{if(done)return;done=true;navigator.geolocation.clearWatch(id);clearTimeout(t1);clearTimeout(t2);best?res(best):rej(new Error('No GPS fix. Try stepping outside.'))};
    id=navigator.geolocation.watchPosition(pos=>{
      if(!best||pos.coords.accuracy<best.coords.accuracy)best=pos;
      say(`Getting GPS… ±${Math.round(best.coords.accuracy*3.281)} ft`);
      if(best.coords.accuracy<=25)finish();
    },err=>{
      if(err.code===1){done=true;navigator.geolocation.clearWatch(id);clearTimeout(t1);clearTimeout(t2);
        rej(new Error('Location is blocked. On iPhone: Settings → Privacy → Location Services → Safari Websites → While Using, and turn on Precise Location.'))}
    },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
    const t1=setTimeout(()=>{if(best&&best.coords.accuracy<=100)finish()},4000);
    const t3=setTimeout(()=>{if(best)finish()},8000);
    const t2=setTimeout(()=>{clearTimeout(t3);finish()},15000);
  });
}

// addresses you fixed by hand get reused for any punch within ~500 ft of that spot
// give up on a slow lookup after a few seconds instead of hanging
function fetchT(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
const PLACEKEY='jobclock.places.v1';
let places=read(PLACEKEY,[]);
const meters=(a,b)=>crowMiles(a,b)*1609.344;
// built-in spots everyone at Attronica uses
const BUILTIN=[{lat:37.74442,lon:-77.467856,address:WAREHOUSE,r:200}];
function knownPlace(lat,lon){
  let hit=null,hd=153;
  for(const pl of places){const d=meters({lat,lon},pl);if(d<hd){hd=d;hit=pl}}
  if(hit)return hit;
  for(const pl of BUILTIN)if(meters({lat,lon},pl)<pl.r)return pl;
  return null;
}
// fix older punches at the warehouse that got a nearby business or house number
setTimeout(()=>{let n=0;punches.forEach(p=>{if(p.lat!=null&&!p.manualAddr&&p.address!==WAREHOUSE&&meters(p,BUILTIN[0])<BUILTIN[0].r){p.address=WAREHOUSE;n++}});if(n){save();render()}},0);
function rememberPlace(lat,lon,address){
  places=places.filter(pl=>meters({lat,lon},pl)>=153);
  if(address)places.push({lat,lon,address});
  write(PLACEKEY,places);
  // fix earlier punches at this same spot that got a wrong auto address
  if(address)punches.forEach(p=>{if(p.lat!=null&&!p.manualAddr&&meters({lat,lon},p)<153)p.address=address});
}

// nearby named place (school, business, etc.) from OpenStreetMap
const PRIORITY=/^(school|college|university|kindergarten|hospital|clinic|library|townhall|courthouse|fire_station|police|community_centre|place_of_worship)$/;
async function nearbyPlace(lat,lon){
  const q=`[out:json][timeout:5];nwr(around:150,${lat},${lon})[name][~"^(amenity|shop|office|healthcare|leisure|tourism|building|craft)$"~"."];out center tags 25;`;
  const r=await fetchT('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),6000);
  if(!r.ok)throw 0;
  const els=(await r.json()).elements||[];
  const scored=els.map(e=>{
    const c=e.center||{lat:e.lat,lon:e.lon},tg=e.tags||{};
    const pri=PRIORITY.test(tg.amenity||'')?0:(tg.shop||tg.office||tg.amenity||tg.healthcare)?1:2;
    return {tg,pri,d:c.lat!=null?meters({lat,lon},c):999};
  }).filter(x=>x.tg.building!=='house'&&x.tg.building!=='residential');
  scored.sort((a,b)=>a.pri-b.pri||a.d-b.d);
  return scored[0]?.tg||null;
}
async function lookup(lat,lon){
  const known=knownPlace(lat,lon);
  if(known)return known.address;
  const [base,poi]=await Promise.allSettled([
    fetchT(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1`,6000).then(r=>{if(!r.ok)throw 0;return r.json()}),
    nearbyPlace(lat,lon)
  ]);
  const j=base.status==='fulfilled'?base.value:null,a=j?.address||{},tg=poi.status==='fulfilled'?poi.value:null;
  const town=a.city||a.town||a.village||a.hamlet||a.county||'';
  const stZip=[(a['ISO3166-2-lvl4']||'').split('-')[1]||a.state_code||a.state,a.postcode].filter(Boolean).join(' ');
  if(tg?.name){
    // use the place's own street address if it's mapped; otherwise just name + town (the nearest house number is often wrong)
    const street=tg['addr:housenumber']&&tg['addr:street']?`${tg['addr:housenumber']} ${tg['addr:street']}`:'';
    const ptown=tg['addr:city']||town,pzip=[(a['ISO3166-2-lvl4']||'').split('-')[1]||a.state_code||a.state||tg['addr:state'],tg['addr:postcode']||a.postcode].filter(Boolean).join(' ');
    return [tg.name,street,ptown,pzip].filter(Boolean).join(', ');
  }
  if(!j)throw 0;
  const street=[a.house_number,a.road].filter(Boolean).join(' ');
  return [street,town,stZip].filter(Boolean).join(', ')||j.display_name||null;
}
function crowMiles(a,b){
  const R=3958.8,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
async function driveMiles(a,b){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
  if(!r.ok)throw 0;
  const j=await r.json();
  if(!j.routes||!j.routes[0])throw 0;
  return j.routes[0].distance/1609.344;
}

/* ---------- punching ---------- */
let lastTap=0;
async function punch(type,opt={}){
  if(Date.now()-lastTap<1500)return; // ignore accidental double taps
  const st=state(),noWo=$('noWo').checked||opt.warehouse;
  const wo=noWo?'':$('wo').value.trim().toUpperCase();
  if(type==='site_in'&&!wo&&!noWo){say('Type the work order #, or tick No work order.',true);$('wo').focus();return}
  // save the punch right away at the time you tapped; location + address fill in behind the scenes
  const p={id:Date.now().toString(36),type,time:new Date().toISOString(),
    workOrder:type==='site_in'?(wo||null):(type==='site_out'?st.wo:null),
    note:$('note').value.trim()||null,lat:null,lon:null,acc:null,address:null,locating:true};
  if(type==='site_in')p.local=opt.warehouse?true:isLocal;
  if(type==='site_out')p.local=st.loc;
  if(type==='site_in'&&opt.warehouse)p.warehouse=true;
  if(type==='site_out'&&st.wh)p.warehouse=true;
  if(p.warehouse)p.address=WAREHOUSE;
  const group=[p];
  // clocking out straight from a site counts as leaving it first
  if(type==='clock_out'&&st.s==='site'){const so={...p,id:p.id+'s',type:'site_out',workOrder:st.wo,local:st.loc,warehouse:st.wh||undefined,note:null};if(st.wh)so.address=WAREHOUSE;group.unshift(so)}
  punches.push(...group);save();
  if(type==='site_in'&&wo){recentWO=[wo,...recentWO.filter(x=>x!==wo)].slice(0,4);write(WOKEY,recentWO)}
  $('noWo').checked=false;$('wo').disabled=false;$('wo').value='';$('note').value='';$('note').hidden=true;$('noteBtn').hidden=false;
  lastTap=Date.now();render();say(`${lab(p)} saved · ${fmtTime(p.time)}`);
  locate(group);
}
async function locate(group){
  const p=group[group.length-1],set=(k,v)=>group.forEach(x=>x[k]=v);
  try{
    const pos=await getPosition();
    set('lat',+pos.coords.latitude.toFixed(6));set('lon',+pos.coords.longitude.toFixed(6));set('acc',Math.round(pos.coords.accuracy));
    if(p.warehouse&&p.type==='site_in'&&p.acc<=150)rememberPlace(p.lat,p.lon,WAREHOUSE);
    if(!p.address){
      const known=knownPlace(p.lat,p.lon);
      if(known)group.forEach(x=>{if(!x.address)x.address=known.address});
    }
    set('locating',false);save();render();
    if(!p.address){
      say('Finding the address…');
      try{const a=await lookup(p.lat,p.lon);group.forEach(x=>{if(!x.address)x.address=a})}catch(e){}
    }
    save();render();
    say(`${lab(p)} · ${fmtTime(p.time)}${p.address?' · '+p.address:' · address fills in when you get signal'}`);
  }catch(e){set('locating',false);save();render();say(e.message+' Punch saved without location.',true)}
  fillMiles();
}

/* forgot to clock out: flag a shift that started on an earlier day or has run past 13 hours */
function forgotCheck(st){
  if(st.s==='off'||!st.shift)return false;
  const age=Date.now()-new Date(st.shift);
  if(read(DISMISS,null)===st.shift&&age<20*3600e3)return false;
  return dayKey(st.shift)!==dayKey(new Date())||age>13*3600e3;
}

/* ---------- mileage legs ---------- */
function legsFor(list){
  const legs=[];let from=null;
  for(const p of list){
    if((p.type==='site_in'||p.type==='clock_out')&&from&&p.lat!=null&&from.lat!=null){
      // mileage only counts going to or coming back from a non-local job
      const counts=(p.type==='site_in'&&p.local!==true)||(from.type==='site_out'&&from.local!==true);
      legs.push({from,to:p,wo:p.type==='site_in'?p.workOrder:null,wh:!!(p.type==='site_in'&&p.warehouse),counts});
    }
    if(p.lat!=null)from=p;
  }
  return legs.filter(l=>l.to.legMi==null||l.to.legMi>=0.2);
}
const legMiles=legs=>legs.reduce((a,l)=>a+(l.counts?(l.to.legMi||0):0),0);
async function fillMiles(){
  const all=Object.values(byDay()).flatMap(legsFor).filter(l=>l.to.legMi==null||l.to.legSrc==='est');
  if(!all.length)return;
  for(const l of all){
    try{l.to.legMi=+(await driveMiles(l.from,l.to)).toFixed(1);l.to.legSrc='road'}
    catch(e){if(l.to.legMi==null){l.to.legMi=+(crowMiles(l.from,l.to)*1.2).toFixed(1);l.to.legSrc='est'}}
  }
  save();render();
}
const legText=l=>`Miles: ${l.to.legMi??''}\nStart: ${place(l.from)}\nEnd: ${place(l.to)}\nWork Order#: ${l.wo||''}`;

function weekSummary(start){
  const hrs=hoursByDay(),days=byDay(),out=[];let tot=0,mi=0;
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);const k=dayKey(d);
    const h=hrs[k]||0,m=legMiles(legsFor(days[k]||[]));
    tot+=h;mi+=m;out.push({d,k,h,m});
  }
  return {days:out,tot,mi,ot:Math.max(0,tot-40*3600e3)};

const PAYKEY='jobclock.pay.v1';
let pay=read(PAYKEY,{rate:null,otAfter:40,otMult:1.5,mile:null});
const money=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function payFor(w){
  if(!pay.rate)return null;
  const otAfter=(pay.otAfter??40)*3600e3,regMs=Math.min(w.tot,otAfter),otMs=Math.max(0,w.tot-otAfter);
  const reg=regMs/3600e3*pay.rate,ot=otMs/3600e3*pay.rate*(pay.otMult||1.5),mi=pay.mile?w.mi*pay.mile:0;
  return {reg,ot,mi,gross:reg+ot,regH:regMs/3600e3,otH:otMs/3600e3};
}
function renderPay(w){
  const p=payFor(w);
  if(!p){$('payAmt').innerHTML='$ —<small>Set your hourly rate to see this week\'s pay</small>';$('paySub').innerHTML='';return}
  $('payAmt').innerHTML=`${money(p.gross)}<small>Est. pay this week, before taxes</small>`;
  $('paySub').innerHTML=`<span>Regular: ${p.regH.toFixed(2)} hrs × ${money(pay.rate)} = ${money(p.reg)}</span>`+
    `<span>Overtime: ${p.otH.toFixed(2)} hrs × ${money(pay.rate*(pay.otMult||1.5))} = ${money(p.ot)}</span>`+
    (pay.mile?`<span>Mileage: ${w.mi.toFixed(1)} mi × ${money(pay.mile)} = ${money(p.mi)} (paid separately)</span>`:'');
}
$('payEdit').onclick=()=>{
  const f=$('payForm');f.hidden=!f.hidden;
  if(!f.hidden){$('payRate').value=pay.rate??'';$('payOtAfter').value=pay.otAfter??40;$('payOtMult').value=pay.otMult??1.5;$('payMile').value=pay.mile??'';$('payRate').focus()}
};
$('payForm').onsubmit=e=>{
  e.preventDefault();
  const num=(v,d)=>{const n=parseFloat(v);return isFinite(n)&&n>=0?n:d};
  pay={rate:num($('payRate').value,null)||null,otAfter:num($('payOtAfter').value,40),otMult:num($('payOtMult').value,1.5)||1.5,mile:num($('payMile').value,null)||null};
  write(PAYKEY,pay);$('payForm').hidden=true;render();say(pay.rate?'Pay rate saved.':'Pay rate cleared.');
};
function renderWeek(){
  const ws=weekStart(new Date()),w=weekSummary(ws),end=new Date(ws);end.setDate(end.getDate()+6);
  $('weekRange').textContent=`${ws.toLocaleDateString([], {month:'short',day:'numeric'})} – ${end.toLocaleDateString([], {month:'short',day:'numeric'})}`;
  const tk=dayKey(new Date());
  $('week').innerHTML=`<div class="stats">
      <div class="stat"><span class="k">Hours</span><b>${hm(w.tot)}</b></div>
      <div class="stat ot"><span class="k">Overtime</span><b>${hm(w.ot)}</b></div>
      <div class="stat mi2"><span class="k">Miles</span><b>${w.mi.toFixed(1)}</b></div></div>
    <div class="days">${w.days.filter(x=>x.h||x.m||x.k===tk).map(x=>`<div class="dayrow${x.k===tk?' today':''}">${x.d.toLocaleDateString([], {weekday:'short',month:'numeric',day:'numeric'})}<span>${hm(x.h)}</span><span>${x.m.toFixed(1)} mi</span></div>`).join('')}</div>`;
  renderPay(w);
}

function render(){
  const st=state(),{s,since,last,wo,shift,visit}=st;
  $('status').dataset.s=s;
  $('state').textContent={off:'Off the clock',on:'On the clock',site:st.wh?'At warehouse':'At job site'}[s];
  $('pill').textContent={off:'Off',on:'Working',site:'On site'}[s];
  $('timer').textContent=shift&&s!=='off'?`Shift ${hm(Date.now()-new Date(shift))}${s==='site'?' · on site '+hm(Date.now()-new Date(since)):''}`:(since?`Last out ${fmtTime(since)}`:'');
  $('where').innerHTML=s==='off'||!last?'':ic('pin')+'<span>'+esc((s==='site'&&wo?wo+' · ':'')+place(last))+'</span>';

  const forgot=forgotCheck(st);
  $('forgot').hidden=!forgot;
  if(forgot){
    $('forgotText').textContent=`You've been on the clock since ${fmtDay(shift)} at ${fmtTime(shift)}${s==='site'&&wo?`, checked in at ${wo}`:''}.`;
    if(document.activeElement!==$('forgotTime')){const guess=new Date(new Date(since).getTime()+30*60e3);$('forgotTime').value=toLocalInput(guess>new Date()?new Date():guess)}
  }

  $('woBox').hidden=s!=='on';
  $('chips').innerHTML='';
  recentWO.forEach(w=>{const c=document.createElement('button');c.type='button';c.className='chip';c.innerHTML=ic('hash')+esc(w);c.onclick=()=>{$('wo').value=w;$('wo').focus()};$('chips').appendChild(c)});

  const go=$('go'),alt=$('alt');
  const plan={off:['clock_in','Clock in','Start your day',null],on:['site_in','Check in','Arrive at job site','clock_out'],site:st.wh?['site_out','Leave warehouse','Heading out','clock_out']:['site_out','Leave site','Done at '+(wo||'this job'),'clock_out']}[s];
  go.dataset.type=plan[0];
  go.innerHTML=busy?`${ic('pin')}<span class="lbl">Saving…<small>Getting location</small></span>`:`${ic(ICON[plan[0]])}<span class="lbl">${plan[1]}<small>${esc(plan[2])}</small></span>`;
  go.disabled=busy;
  alt.hidden=!plan[3];alt.dataset.type=plan[3]||'';alt.innerHTML=ic('out')+'Clock out';alt.disabled=busy;

  // job notes + photos while on site (keep the box alive while typing)
  const jb=$('jobBox');
  if(s==='site'&&visit&&!st.wh){
    jb.hidden=false;$('jobTitle').textContent=`Job notes · ${visit.workOrder||'No work order'}`;
    const typing=document.activeElement?.id==='jobNotes-'+visit.id;
    if(!typing||jb.dataset.v!==visit.id+(visit.photos||[]).join()+surePhoto){$('jobBody').replaceChildren(jobEditor(visit));jb.dataset.v=visit.id+(visit.photos||[]).join()+surePhoto}
  }else{jb.hidden=true;$('jobBody').innerHTML='';jb.dataset.v=''}

  const days=byDay(),tk=dayKey(new Date()),today=days[tk]||[],hrs=hoursByDay();
  if(today.length)punchRows(today,$('today'));else $('today').innerHTML='<div class="empty">Nothing yet today. Clock in when you get to the warehouse.</div>';
  $('todayHrs').textContent=hrs[tk]?hm(hrs[tk]):'';
  renderWeek();
  const legs=legsFor(today);
  if(legs.length)legRows(legs,$('legs'));else $('legs').innerHTML='<div class="empty">Each drive shows up here once you check in at a site or clock out.</div>';
  $('todayMi').textContent=legs.length?legMiles(legs).toFixed(1)+' mi':'';

  // history grouped by week (Mon–Sun)
  const h=$('history');h.innerHTML='';
  const past=Object.keys(days).filter(k=>k!==tk).sort().reverse();
  let curWeek=null;
  past.forEach(k=>{
    const ws=weekStart(days[k][0].time),wk=dayKey(ws);
    if(wk!==curWeek){
      curWeek=wk;const w=weekSummary(ws);
      const head=document.createElement('div');head.className='weekhead';
      head.innerHTML=`Week of ${ws.toLocaleDateString([], {month:'short',day:'numeric'})}<span>${hm(w.tot)}${w.ot?' · '+hm(w.ot)+' OT':''} · ${w.mi.toFixed(1)} mi${payFor(w)?' · '+money(payFor(w).gross):''}</span>`;
      h.appendChild(head);
    }
    const list=days[k],sec=document.createElement('section'),lg=legsFor(list);
    sec.innerHTML=`<h2>${fmtDay(list[0].time)}<span>${hm(hrs[k]||0)}${lg.length?' · '+legMiles(lg).toFixed(1)+' mi':''}</span></h2>`;
    const c=document.createElement('div');c.className='card';punchRows(list,c);sec.appendChild(c);
    if(lg.length){const c2=document.createElement('div');c2.className='card';c2.style.marginTop='8px';legRows(lg,c2);sec.appendChild(c2)}
    h.appendChild(sec);
  });
  if(!h.children.length)h.innerHTML='<div class="empty">Past days show up here.</div>';
}

/* ---------- export ---------- */
function download(rows,name){
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
$('csvPunch').onclick=()=>download([['date','time','type','work_order','local','address','latitude','longitude','note','job_notes','photos'],
  ...punches.map(p=>[dayKey(p.time),fmtTime(p.time),lab(p),p.workOrder,p.local==null?'':(p.local?'local':'non-local'),p.address,p.lat,p.lon,p.note,p.jobNotes,(p.photos||[]).length||''])],`punches-${dayKey(new Date())}.csv`);
$('csvLegs').onclick=()=>download([['date','miles','estimated','start_location','end_location','work_order'],
  ...Object.entries(byDay()).sort().flatMap(([k,l])=>legsFor(l).filter(x=>x.counts).map(x=>[k,x.to.legMi,x.to.legSrc==='est'?'yes':'no',place(x.from),place(x.to),x.wo]))],`mileage-${dayKey(new Date())}.csv`);
$('fix').onclick=async()=>{
  const todo=punches.filter(p=>p.lat!=null&&!p.address);
  say(todo.length?`Looking up ${todo.length} address(es)…`:'Checking mileage…');
  for(const p of todo){try{p.address=await lookup(p.lat,p.lon)}catch(e){}await new Promise(r=>setTimeout(r,1100))}
  save();await fillMiles();render();say('Done.');
};

/* ---------- wire up ---------- */
$('go').onclick=()=>punch($('go').dataset.type);
$('alt').onclick=()=>punch($('alt').dataset.type);
$('woBox').onsubmit=e=>{e.preventDefault();punch('site_in')};
$('whBtn').onclick=()=>punch('site_in',{warehouse:true});
$('noWo').onchange=()=>{$('wo').disabled=$('noWo').checked;if($('noWo').checked)$('wo').value=''};
$('locBtn').onclick=()=>setLocal(true);
$('farBtn').onclick=()=>setLocal(false);
setLocal(isLocal);
$('noteBtn').onclick=()=>{$('note').hidden=false;$('noteBtn').hidden=true;$('note').focus()};
document.getElementById('logo').src=document.querySelector('link[rel=apple-touch-icon]').href;
function tick(){$('now').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
// no signal: show a chip, and fill in addresses + miles once service comes back
async function backOnline(){
  $('net').hidden=navigator.onLine;
  if(!navigator.onLine)return;
  const todo=punches.filter(p=>p.lat!=null&&!p.address);
  for(const p of todo){try{p.address=await lookup(p.lat,p.lon)}catch(e){}await new Promise(r=>setTimeout(r,1100))}
  if(todo.length){save();render()}
  fillMiles();
}
addEventListener('online',backOnline);addEventListener('offline',()=>{$('net').hidden=false});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
tick();render();backOnline();
setInterval(()=>{tick();const a=document.activeElement?.tagName;if(!busy&&!editingId&&a!=='INPUT'&&a!=='TEXTAREA')render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editingId){tick();render()}});
</script>
